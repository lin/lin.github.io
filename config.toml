baseURL = 'https://yingkui.com/'
languageCode = 'en-us'
title = "Yingkui Lin"
theme = "hugo-ink"

copyright = "© Copyright Yingkui.com All Rights Reserved"

[params]
  subtitle = "A Curious Mind."
  avatar = "/logo-ai.jpg"
  customCSS = "css/custom.css"  # Custom CSS applied to default styles.
  mainSections = ['posts']
  math = true

[[menu.main]]
name = "Essays"
url = "/"
weight = 1

[[menu.main]]
name = "About"
url = "/about"
weight = 3

[permalinks]
  posts = '/:contentbasename'
  pages = '/:contentbasename'
  archives = '/:contentbasename'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]

[[module.mounts]]
  source = "content"
  target = "content"
  # 换算页与数据放在一起便于直接打开；它是完整的 HTML 文档，
  # 交给 Hugo 会被套进主题模板变成嵌套页面，所以不参与站点构建。
  # 发布版本在 static/gaokao-convert/index.html。
  # README 是给自己看的数据说明，同样不该变成一个页面。
  excludeFiles = ["2007/convert/index.html", "2007/convert/README.md"]

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "content/img"
  target = "static/img"
