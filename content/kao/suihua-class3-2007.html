<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2007年绥化一中高三三班 · 中考与高考预测三曲线</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
  :root{
    color-scheme: light;

    --rule:#c8d0d0; --hair:#dbe1e1;
    --petrol:#0e5b68; --petrol-w:rgba(14,91,104,.10);
    --seal:#a5342a; --seal-w:rgba(165,52,42,.09);

    --bar:#9aa8ab;
    --shadow:0 1px 2px rgba(14,20,22,.05),0 12px 30px -20px rgba(14,20,22,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --paper:#0b0f10; --card:#151a1b; --sunk:#101516; --band:#1b2223;
      --ink:#e9eeee; --ink-2:#a6b2b5; --ink-3:#748084;
      --rule:#28302f; --hair:#202727;
      --petrol:#4fa7b6; --petrol-w:rgba(79,167,182,.13);
      --seal:#dc6553; --seal-w:rgba(220,101,83,.14);
      --amber:#d99a2e; --amber-w:rgba(217,154,46,.14);
      --bar:#4a5658;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -20px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#0b0f10; --card:#151a1b; --sunk:#101516; --band:#1b2223;
    --ink:#e9eeee; --ink-2:#a6b2b5; --ink-3:#748084;
    --rule:#28302f; --hair:#202727;
    --petrol:#4fa7b6; --petrol-w:rgba(79,167,182,.13);
    --seal:#dc6553; --seal-w:rgba(220,101,83,.14);
    --amber:#d99a2e; --amber-w:rgba(217,154,46,.14);
    --bar:#4a5658;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -20px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased;
    padding:44px 22px 88px}
  .wrap{max-width:1180px;margin:0 auto}
  .m{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

  header{margin-bottom:26px}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 14px}
  h1{font-family:"Noto Serif SC",Songti SC,serif;font-weight:700;font-size:clamp(24px,4.2vw,36px);line-height:1.15;
    letter-spacing:.01em;text-wrap:balance}
  .dek{margin:16px 0 0;max-width:66ch;color:var(--ink-2);font-size:15px}
  .byline{margin:20px 0 0;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;
    color:var(--ink-3);border-top:2px solid var(--ink);padding-top:11px}

  .controls{display:flex;gap:10px;align-items:center;margin:22px 0 12px;flex-wrap:wrap}
  .controls .lab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3)}
  .seg{display:inline-flex;border:1px solid var(--rule);background:var(--card);overflow:hidden}
  .seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);cursor:pointer;
    font-family:"Noto Sans SC",sans-serif;font-size:13px;padding:6px 14px;line-height:1.4}
  .seg button+button{border-left:1px solid var(--rule)}
  .seg button[aria-pressed="true"]{background:var(--seal);color:#fff}

  .legend{display:flex;gap:20px;justify-content:flex-start;flex-wrap:wrap;margin:12px 0 14px}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);
    font-family:"IBM Plex Mono",monospace}
  .legend-dot{width:9px;height:9px;border-radius:50%}
  .legend-ring{width:10px;height:10px;border-radius:50%;border:1.6px solid var(--bar)}
  .legend-line{width:24px;border-top:2px dashed}
  .legend-band{width:22px;height:11px;background:var(--petrol-w);border:1px solid var(--petrol-w)}

  .fig{background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);
    padding:16px 14px 10px;overflow-x:auto}
  #chart-svg{display:block;width:100%;min-width:860px}
  text.ax{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:var(--ink-3)}
  text.axttl{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:var(--ink-2);letter-spacing:.04em}
  text.anno{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600}
  text.anno.pet{fill:var(--petrol)}
  text.anno.amb{fill:var(--amber)}
  text.name1{font-family:"Noto Sans SC",sans-serif;font-size:11px;font-weight:600;fill:var(--seal)}
  text.name2{font-family:"IBM Plex Mono",monospace;font-size:8.5px;fill:var(--ink-3)}
  line.hair{stroke:var(--hair);stroke-width:1}
  circle.d-actual{fill:var(--seal);cursor:pointer}
  circle.d-daqing{cursor:pointer}

  .figcap{font-size:12px;color:var(--ink-3);max-width:92ch;margin:12px 2px 0;line-height:1.7}
  .figcap b{color:var(--seal)}

  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);
    border:1px solid var(--rule);margin:24px 0 0}
  .sc{background:var(--card);padding:14px 15px 13px}
  .sc b{display:block;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:24px;line-height:1.15;
    font-variant-numeric:tabular-nums}
  .sc span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:4px;letter-spacing:.02em}
  .sc.hi b{color:var(--seal)}
  .sc.ok b{color:var(--petrol)}

  .notes{background:var(--sunk);border:1px solid var(--rule);padding:18px 22px;margin:24px 0 0;
    font-size:12.5px;line-height:1.75;color:var(--ink-2);max-width:92ch}
  .notes .hd{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);display:block;margin-bottom:9px}
  .notes b{color:var(--ink)}

  .tooltip{position:fixed;background:var(--card);border:1px solid var(--rule);border-radius:8px;
    padding:11px 14px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .14s ease;z-index:9999;
    min-width:220px;box-shadow:var(--shadow)}
  .tooltip.visible{opacity:1}
  .tooltip .t-name{font-size:13px;font-weight:700;margin-bottom:7px;color:var(--ink)}
  .tooltip .t-row{display:flex;justify-content:space-between;gap:16px;margin-top:3px;color:var(--ink-3);
    font-family:"IBM Plex Mono",monospace}
  .tooltip .t-val{color:var(--ink-2);font-weight:500}
  .tooltip .t-diff{margin-top:7px;padding-top:7px;border-top:1px solid var(--rule);font-size:11.5px;
    font-family:"IBM Plex Mono",monospace}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="wrap">

<header>
  <p class="kicker">绥化一中 三班 · 2004 中考 → 2007 高考</p>
  <h1>把三班放回大庆的散点里</h1>
  <p class="dek">petrol 线是用大庆<strong>按中考入学筛选的无偏样本</strong>拟合的回归
  （高考 = 0.878×中考 + 114.7，r = 0.74，σ ≈ 16），淡色带是 ±1σ。
  灰点是已知中考、高考的<strong>大庆考生（中考 ≥ 610）</strong>——他们均匀散布在回归线两侧。
  <span class="m" style="color:var(--seal)">seal</span> 点是三班同学的实测高考分：<strong>整班沉在带子下面</strong>。</p>
  <p class="byline">大庆 39 人来自「2007 高考大庆市中高考分数比对表」· 三班前 38 名 · 三班横坐标为按高考位次反推的等效中考分</p>
</header>

<div class="controls">
  <span class="lab">三班标注</span>
  <div class="seg" id="seg">
    <button data-mode="name" aria-pressed="true">显示姓名</button>
    <button data-mode="rank" aria-pressed="false">只显示班级名次</button>
  </div>
</div>

<div class="legend" id="legend"></div>

<div class="fig">
  <svg id="chart-svg"></svg>
</div>
<p class="figcap" id="figcap"></p>

<div class="strip" id="stats-row"></div>
<div class="notes" id="note-text"></div>
<div class="tooltip" id="tooltip"></div>

<script>
// ===================== DATA =====================
// 三班：横坐标 zhongkao 为按高考位次反推的「等效中考分」，predict 为回归条件均值
const RAW = [

  {rank:31,zhongkao:634.6,predict:671.8,lo:603,hi:601,name:'李冬',uni:'中国矿业大学'},
  {rank:32,zhongkao:634.3,predict:671.6,lo:601,hi:607,name:'张赫琼',uni:'南京农大'},
  {rank:33,zhongkao:634.0,predict:671.3,lo:597,hi:603,name:'张士萍',uni:'河海大学'},
  {rank:34,zhongkao:633.7,predict:671.1,lo:593,hi:599,name:'侯雨薇',uni:'江西财经大学'},
  {rank:35,zhongkao:633.4,predict:670.8,lo:588,hi:593,name:'王丽圆',uni:'哈理工'},
  {rank:36,zhongkao:633.1,predict:670.6,lo:588,hi:588,name:'王晓薇',uni:'哈理工'},
  {rank:37,zhongkao:632.8,predict:670.3,lo:588,hi:588,name:'陈媛丽',uni:'哈理工'},
  {rank:38,zhongkao:632.6,predict:670.1,lo:588,hi:588,name:'邹笑天',uni:'哈理工'},
];

// 大庆：已知 2004 中考 & 2007 高考的逐人配对，取中考 ≥ 610（cred A/B）
const DAQING = [
  {n:'李梦然',s:648,g:709,sc:'实验',key:true},
  {n:'陈川',s:634,g:698,sc:'一中'},   {n:'李悦',s:623,g:697,sc:'一中'},
  {n:'张远洋',s:615,g:695,sc:'铁人'}, {n:'李璐',s:663,g:693,sc:'一中'},
  {n:'蒋莉',s:642,g:691,sc:'一中'},   {n:'关天下',s:656,g:690,sc:'一中'},
  {n:'杜宇寰',s:644,g:688,sc:'一中'}, {n:'魏征',s:654,g:688,sc:'实验'},
  {n:'李海旭',s:626,g:685,sc:'一中'}, {n:'曹琪',s:638,g:683,sc:'一中'},
  {n:'牛雨军',s:630,g:683,sc:'一中'}, {n:'王鑫',s:623,g:681,sc:'铁人',soft:true},
  {n:'符迪',s:633,g:680,sc:'一中'},   {n:'王惠西',s:639,g:678,sc:'一中'},
  {n:'刘安东',s:645,g:676,sc:'一中'}, {n:'张洪谋',s:646,g:676,sc:'一中'},
  {n:'于燕池',s:623,g:675,sc:'一中'}, {n:'张丽娜',s:626,g:669,sc:'一中'},
  {n:'李岩松',s:624,g:668,sc:'一中'}, {n:'权文琪',s:629,g:666,sc:'一中'},
  {n:'王金鑫',s:642,g:666,sc:'一中'}, {n:'鲍慊',s:644,g:666,sc:'一中'},
  {n:'曹明阳',s:625,g:664,sc:'一中'}, {n:'曹沂',s:638,g:664,sc:'一中'},
  {n:'梁轶',s:634,g:661,sc:'一中'},   {n:'顾舒然',s:622,g:661,sc:'一中'},
  {n:'周旸',s:611,g:657,sc:'一中'},   {n:'孟志昊',s:613,g:657,sc:'一中'},
  {n:'张晨',s:630,g:655,sc:'一中'},   {n:'冯聪',s:628,g:650,sc:'一中'},
  {n:'杨赫',s:625,g:649,sc:'一中'},   {n:'吕秀娟',s:624,g:645,sc:'一中'},
  {n:'李秋稷',s:622,g:644,sc:'一中'}, {n:'陈麒',s:618,g:642,sc:'一中'},
  {n:'任聪',s:620,g:641,sc:'一中'},   {n:'朱梓璇',s:618,g:639,sc:'一中'},
  {n:'杨超',s:615,g:638,sc:'一中'},   {n:'高嵽',s:612,g:635,sc:'一中'},
];

const SLOPE = 0.878, INT = 114.7, SIGMA = 16;

RAW.forEach(d => {
  d.actualLo = Math.min(d.lo, d.hi);
  d.actualHi = Math.max(d.lo, d.hi);
  d.actualMid = (d.actualLo + d.actualHi) / 2;
  d.isRange = d.actualHi !== d.actualLo;
  d.diff = d.actualMid - d.predict;
});
DAQING.forEach(d => { d.diff = d.g - (SLOPE * d.s + INT); });

// ===================== SCALES =====================
const svg = document.getElementById('chart-svg');
const tooltip = document.getElementById('tooltip');

const MARGIN = {top: 34, right: 74, bottom: 54, left: 54};
const CHART_W = 1250, CHART_H = 1060;
const PLOT_W = CHART_W - MARGIN.left - MARGIN.right;
const PLOT_H = CHART_H - MARGIN.top - MARGIN.bottom;
const xMin = 610, xMax = 664, yMin = 580, yMax = 715;

function xS(v){ return MARGIN.left + ((v - xMin) / (xMax - xMin)) * PLOT_W; }
function yS(v){ return MARGIN.top + PLOT_H - ((v - yMin) / (yMax - yMin)) * PLOT_H; }
function line(v){ return SLOPE * v + INT; }

svg.setAttribute('viewBox', `0 0 ${CHART_W} ${CHART_H}`);
svg.setAttribute('width', CHART_W);
svg.setAttribute('height', CHART_H);
svg.setAttribute('role', 'img');
svg.setAttribute('aria-label', '三班实测高考分与大庆考生散点、大庆无偏回归线的对照');

function el(tag, attrs={}, text){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  if(text != null) e.textContent = text;
  return e;
}
const CJK = /[㐀-鿿豈-﫿]/;
function textW(s, size){ let w = 0; for(const ch of s) w += CJK.test(ch) ? size : size * 0.56; return w; }

const schoolColor = sc => sc === '实验' ? 'var(--amber)' : sc === '铁人' ? 'var(--petrol)' : 'var(--bar)';

// ===================== TOOLTIP =====================
function tipHTML(title, rows, diff){
  let h = `<div class="t-name">${title}</div>`;
  rows.forEach(([k,v]) => h += `<div class="t-row"><span>${k}</span><span class="t-val">${v}</span></div>`);
  if(diff != null){
    const c = diff >= 0 ? 'var(--petrol)' : 'var(--seal)';
    h += `<div class="t-diff" style="color:${c}">缺口 ${diff >= 0 ? '+' : ''}${diff.toFixed(1)} 分（实测 − 回归预测）</div>`;
  }
  return h;
}
function bindTip(node, htmlFn){
  node.addEventListener('mouseenter', e => {
    tooltip.innerHTML = htmlFn();
    tooltip.classList.add('visible');
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 12) + 'px';
  });
  node.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 12) + 'px';
  });
  node.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
}

// ===================== BUILD =====================
let MODE = 'name';

function buildChart(){
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  // ---- grid ----
  for(let s = 580; s <= yMax; s += 5){
    const y = yS(s);
    svg.appendChild(el('line', {x1:MARGIN.left, y1:y, x2:MARGIN.left+PLOT_W, y2:y, class:'hair',
      opacity: s % 20 === 0 ? 1 : 0.4}));
    if(s % 20 === 0) svg.appendChild(el('text', {x:MARGIN.left-9, y:y+3.5, 'text-anchor':'end', class:'ax'}, s));
  }
  for(let s = 610; s <= xMax; s += 5){
    const x = xS(s);
    svg.appendChild(el('line', {x1:x, y1:MARGIN.top, x2:x, y2:MARGIN.top+PLOT_H, class:'hair',
      opacity: s % 10 === 0 ? 1 : 0.4}));
    if(s % 10 === 0) svg.appendChild(el('text', {x:x, y:MARGIN.top+PLOT_H+17, 'text-anchor':'middle', class:'ax'}, s));
  }
  svg.appendChild(el('text', {x:MARGIN.left+PLOT_W/2, y:CHART_H-8, 'text-anchor':'middle', class:'axttl'},
    '2004 中考分数（大庆考生为实测；三班为按 2007 高考位次反推的等效中考分）'));
  svg.appendChild(el('text', {x:14, y:18, class:'axttl'}, '2007 高考总分'));

  // ---- ±1σ band + regression line ----
  const bx0 = xS(xMin), bx1 = xS(xMax);
  svg.appendChild(el('polygon', {
    points: `${bx0},${yS(line(xMin)+SIGMA)} ${bx1},${yS(line(xMax)+SIGMA)} ${bx1},${yS(line(xMax)-SIGMA)} ${bx0},${yS(line(xMin)-SIGMA)}`,
    fill: 'var(--petrol)', opacity: '0.10'
  }));
  svg.appendChild(el('line', {x1:bx0, y1:yS(line(xMin)), x2:bx1, y2:yS(line(xMax)),
    stroke:'var(--petrol)', 'stroke-width':1.8, 'stroke-dasharray':'6 4', opacity:'0.9'}));
  svg.appendChild(el('text', {x: xS(628), y: yS(line(628)) - 7, 'text-anchor':'middle', class:'anno pet'},
    '大庆无偏回归 · 高考 = 0.878×中考 + 114.7'));
  svg.appendChild(el('text', {x: bx0 + 6, y: yS(line(xMin)+SIGMA) - 5, class:'ax', fill:'var(--petrol)'}, '回归 +1σ'));
  svg.appendChild(el('text', {x: bx0 + 6, y: yS(line(xMin)-SIGMA) + 13, class:'ax', fill:'var(--petrol)'}, '回归 −1σ'));

  // ---- 中考 648 reference (林英魁 / 李梦然 same score) ----
  const x648 = xS(648);
  svg.appendChild(el('line', {x1:x648, y1:MARGIN.top, x2:x648, y2:MARGIN.top+PLOT_H,
    stroke:'var(--ink-3)', 'stroke-width':1, 'stroke-dasharray':'2 3', opacity:'0.5'}));
  svg.appendChild(el('text', {x:x648, y:MARGIN.top - 5, 'text-anchor':'middle', class:'ax'}, '中考 648'));

  // ---- 大庆 dots ----
  DAQING.forEach(d => {
    const cx = xS(d.s), cy = yS(d.g);
    const common = {cx, cy, class:'d-daqing'};
    let dot;
    if(d.soft){
      dot = el('circle', {...common, r:3.4, fill:'none', stroke:'var(--bar)', 'stroke-width':1.4});
    } else if(d.key){
      dot = el('circle', {...common, r:5, fill:'var(--amber)', stroke:'var(--card)', 'stroke-width':1.2});
    } else {
      dot = el('circle', {...common, r:3.4, fill:schoolColor(d.sc), 'fill-opacity':'0.85'});
    }
    svg.appendChild(dot);
    bindTip(dot, () => tipHTML(
      MODE === 'name' ? `${d.n}（大庆${d.sc}）` : `大庆${d.sc}考生`,
      [['2004 中考', d.s + (d.soft ? '（配对存疑）' : '')], ['2007 高考', d.g], ['回归预测', Math.round(line(d.s))]],
      d.diff));
  });
  // 李梦然 callout
  const lm = DAQING.find(d => d.key);
  svg.appendChild(el('line', {x1:xS(lm.s), y1:yS(lm.g), x2:xS(lm.s)+12, y2:yS(lm.g)+16,
    stroke:'var(--amber)', 'stroke-width':0.8, opacity:'0.6'}));
  svg.appendChild(el('text', {x: xS(lm.s) + 14, y: yS(lm.g) + 20, class:'anno amb'},
    (MODE === 'name' ? '李梦然' : '大庆实验考生') + ' 中考 648 → 高考 709（全省第 3，清华应届）'));

  // ---- 三班 connectors (regression -> actual): only for the unlabelled tail ----
  RAW.forEach(d => {
    if(d.actualMid >= 625) return;
    svg.appendChild(el('line', {x1:xS(d.zhongkao), y1:yS(d.predict), x2:xS(d.zhongkao), y2:yS(d.actualMid),
      stroke:'var(--seal)', 'stroke-width':1, opacity:'0.28'}));
  });
  // ---- 三班 actual dots ----
  RAW.forEach(d => {
    const cx = xS(d.zhongkao);
    if(d.isRange){
      svg.appendChild(el('line', {x1:cx, y1:yS(d.actualHi), x2:cx, y2:yS(d.actualLo),
        stroke:'var(--seal)', 'stroke-width':2, opacity:'0.4'}));
    }
    const dot = el('circle', {cx, cy:yS(d.actualMid), r:3.8, class:'d-actual',
      stroke:'var(--card)', 'stroke-width':1.2});
    svg.appendChild(dot);
    const actualStr = d.isRange ? `${d.actualLo}–${d.actualHi}` : `${d.actualLo}`;
    bindTip(dot, () => tipHTML(
      MODE === 'name' ? `#${d.rank} ${d.name}` : `三班 · 第 ${d.rank} 名`,
      [['等效中考分', '≈ ' + d.zhongkao], ['回归预测', d.predict], ['实测高考', actualStr],
       ...(MODE === 'name' && d.uni ? [['录取', d.uni]] : [])],
      d.diff));
  });

  // ---- name labels: three rank-ordered blocks, each near its own dots ----
  //   前四名  -> upper-right, beside their dots
  //   中间四名 -> a tight block, sitting on x between the other two blocks
  //   后九名   -> a column below-left, where those dots are bunched
  const groups = [
    { ranks: [1,2,3,4],                   colX: xS(656.5), y0: yS(664), pitch: 34 },
    { ranks: [5,6,7,8],                   colX: xS(652),   y0: yS(637), pitch: 23 },
    { ranks: [9,10,11,12,13,14,15,16,17], colX: xS(645),   y0: yS(620), pitch: 31 },
  ];
  const byRank = Object.fromEntries(RAW.map(d => [d.rank, d]));
  groups.forEach(g => {
    g.ranks.forEach((rk, i) => {
      const d = byRank[rk];
      const cx = xS(d.zhongkao), cy = yS(d.actualMid);
      const ly = g.y0 + i * g.pitch;
      const diff = Math.round(d.diff);
      const dstr = (diff >= 0 ? '+' : '−') + Math.abs(diff);
      const actualStr = d.isRange ? `${d.actualLo}–${d.actualHi}` : `${d.actualLo}`;
      const l1 = (MODE === 'name' ? d.name : `三班 第${d.rank}名`) + '   ' + dstr;
      const l2 = `中考≈${Math.round(d.zhongkao)}  预测${Math.round(d.predict)}  实测${actualStr}`;
      const ex = g.colX - 5, ey = ly - 3;
      svg.appendChild(el('path', {
        d: `M ${cx.toFixed(1)} ${cy.toFixed(1)} C ${(cx + 22).toFixed(1)} ${cy.toFixed(1)}, ${(ex - 40).toFixed(1)} ${ey.toFixed(1)}, ${ex.toFixed(1)} ${ey.toFixed(1)}`,
        fill: 'none', stroke: 'var(--ink-3)', 'stroke-width': 0.6, opacity: '0.32'
      }));
      svg.appendChild(el('circle', {cx:ex, cy:ey, r:1.2, fill:'var(--ink-3)', opacity:'0.5'}));
      svg.appendChild(el('text', {x:g.colX, y:ly, class:'name1'}, l1));
      svg.appendChild(el('text', {x:g.colX, y:ly + 10, class:'name2'}, l2));
    });
  });
}

// ===================== LEGEND / CAPTION / STATS =====================
function pill(html){ const d = document.createElement('div'); d.className = 'legend-item'; d.innerHTML = html; return d; }
const legend = document.getElementById('legend');
legend.append(
  pill('<span class="legend-line" style="border-color:var(--petrol)"></span>大庆无偏回归线'),
  pill('<span class="legend-band"></span>±1σ（≈16 分）'),
  pill('<span class="legend-dot" style="background:var(--bar)"></span>大庆一中考生'),
  pill('<span class="legend-dot" style="background:var(--amber)"></span>大庆实验'),
  pill('<span class="legend-dot" style="background:var(--petrol)"></span>大庆铁人'),
  pill('<span class="legend-ring"></span>配对存疑'),
  pill('<span class="legend-dot" style="background:var(--seal)"></span>三班实测高考'),
);

const tDiffs = RAW.map(d => d.diff);
const tMean = tDiffs.reduce((a,b)=>a+b,0) / tDiffs.length;
const dDiffs = DAQING.filter(d => !d.soft).map(d => d.diff);
const dMean = dDiffs.reduce((a,b)=>a+b,0) / dDiffs.length;
const dBelow = dDiffs.filter(x => x < 0).length;

document.getElementById('figcap').innerHTML =
  `大庆 ${dDiffs.length} 名考生里 ${dBelow} 人低于回归线、${dDiffs.length - dBelow} 人高于，平均 ${dMean >= 0 ? '+' : ''}${dMean.toFixed(1)} 分——` +
  `散点落在带子两侧，这正是"回归线拟合得好"的样子。` +
  `<b>三班 38 人全部落在回归线以下</b>，平均低 ${Math.abs(tMean).toFixed(1)} 分，` +
  `名次越靠后缺口越大（第 1 名 ${Math.round(RAW[0].diff)}，末尾 ${Math.round(Math.min(...tDiffs))}）。` +
  `与林英魁同为中考 648 分的大庆考生李梦然，高考 709（全省第 3，清华应届）。`;

document.getElementById('stats-row').innerHTML = `
  <div class="sc"><b>${DAQING.length}</b><span>大庆参照考生（中考 ≥ 610）</span></div>
  <div class="sc ok"><b>${dMean >= 0 ? '+' : ''}${dMean.toFixed(1)}</b><span>大庆平均偏离回归线</span></div>
  <div class="sc hi"><b>${tMean.toFixed(1)}</b><span>三班平均偏离回归线</span></div>
  <div class="sc hi"><b>${Math.round(Math.min(...tDiffs))} ~ ${Math.round(Math.max(...tDiffs))}</b><span>三班缺口范围（分）</span></div>
`;

document.getElementById('note-text').innerHTML = `
  <span class="hd">读图说明</span>
  <b>回归线</b>用大庆「2007 年大庆一中市区应届高考与中考成绩对照」里 52 名<b>按中考入学筛选</b>的统招生拟合，
  因此没有范围限制偏差，斜率可信；它回答的是"<b>这个中考分数的人，高考平均考多少</b>"。<br/>
  <b>大庆灰点</b>是另一份「中高考分数比对表」中已双向核对、中考 ≥ 610 的 39 名考生（cred A/B）。他们均匀散布在 ±1σ 带两侧。<br/>
  <b>三班横坐标是等效中考分</b>——用每人的高考全省位次反查当年一分一段、再折算到中考刻度，
  不是实测中考分（林英魁实测中考 648，等效 651.6）。纵向的淡红竖线是每个人"预测 − 实测"的缺口。<br/>
  右侧标注按班内名次从上到下排列；点击顶部按钮可切换为<b>只显示名次</b>以保护隐私。
`;

// ===================== TOGGLE =====================
document.getElementById('seg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn || btn.dataset.mode === MODE) return;
  MODE = btn.dataset.mode;
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === MODE));
  buildChart();
});

buildChart();
</script>
</div>
