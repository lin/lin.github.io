const CLASS3_SLOPE = 1.071, CLASS3_INT = -43.5, CLASS3_R = 0.77;
function class3Line(v){ return CLASS3_SLOPE * v + CLASS3_INT; }

// ===================== SCALES =====================
const svg = document.getElementById('chart-svg');
const tooltip = document.getElementById('tooltip');

const MARGIN = {top: 34, right: 150, bottom: 54, left: 54};
const CHART_W = 1250, CHART_H = 1060;
const PLOT_W = CHART_W - MARGIN.left - MARGIN.right;
const PLOT_H = CHART_H - MARGIN.top - MARGIN.bottom;
const xMin = 565, xMax = 670, yMin = 595, yMax = 715;

function xS(v){ return MARGIN.left + ((v - xMin) / (xMax - xMin)) * PLOT_W; }
function yS(v){ return MARGIN.top + PLOT_H - ((v - yMin) / (yMax - yMin)) * PLOT_H; }
function line(v){ return SLOPE * v + INT; }

svg.setAttribute('viewBox', `0 0 ${CHART_W} ${CHART_H}`);
svg.setAttribute('width', CHART_W);
svg.setAttribute('height', CHART_H);
svg.setAttribute('role', 'img');
svg.setAttribute('aria-label', '三班 47 人与大庆 55 人的实测高考分、大庆回归线的对照，标注林英魁、刘翔、刘欣与李梦然');

function el(tag, attrs={}, text){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  if(text != null) e.textContent = text;
  return e;
}
const CJK = /[㐀-鿿豈-﫿]/;
function textW(s, size){ let w = 0; for(const ch of s) w += CJK.test(ch) ? size : size * 0.56; return w; }

const schoolColor = () => 'var(--bar)'; // 大庆各校统一一个颜色，不再按学校区分

// ===================== TOOLTIP =====================
function tipHTML(title, rows, diff){
  let h = `<div class="t-name">${title}</div>`;
  rows.forEach(([k,v]) => h += `<div class="t-row"><span>${k}</span><span class="t-val">${v}</span></div>`);
  if(diff != null){
    const c = diff >= 0 ? 'var(--petrol)' : 'var(--seal)';
    h += `<div class="t-diff" style="color:${c}">缺口 ${diff >= 0 ? '+' : ''}${diff.toFixed(1)} 分（实测 − 回归预测）</div>`;
  }
  return h;
}
function bindTip(node, htmlFn){
  node.addEventListener('mouseenter', e => {
    tooltip.innerHTML = htmlFn();
    tooltip.classList.add('visible');
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 12) + 'px';
  });
  node.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 12) + 'px';
  });
  node.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
}

// ===================== BUILD =====================
let MODE = 'name';

function buildChart(){
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  // ---- grid ----
  for(let s = 595; s <= yMax; s += 5){
    const y = yS(s);
    svg.appendChild(el('line', {x1:MARGIN.left, y1:y, x2:MARGIN.left+PLOT_W, y2:y, class:'hair',
      opacity: s % 20 === 0 ? 1 : 0.4}));
    if(s % 20 === 0) svg.appendChild(el('text', {x:MARGIN.left-9, y:y+3.5, 'text-anchor':'end', class:'ax'}, s));
  }
  for(let s = 565; s <= xMax; s += 5){
    const x = xS(s);
    svg.appendChild(el('line', {x1:x, y1:MARGIN.top, x2:x, y2:MARGIN.top+PLOT_H, class:'hair',
      opacity: s % 10 === 0 ? 1 : 0.4}));
    if(s % 10 === 0) svg.appendChild(el('text', {x:x, y:MARGIN.top+PLOT_H+17, 'text-anchor':'middle', class:'ax'}, s));
  }
  svg.appendChild(el('text', {x:MARGIN.left+PLOT_W/2, y:CHART_H-8, 'text-anchor':'middle', class:'axttl'},
    '2004 中考分数（大庆考生为实测；三班除林英魁、刘翔、刘欣外均为中考估计分）'));
  svg.appendChild(el('text', {x:14, y:18, class:'axttl'}, '2007 高考总分'));

  // ---- ±1σ band + regression line ----
  const bx0 = xS(xMin), bx1 = xS(xMax);
  svg.appendChild(el('polygon', {
    points: `${bx0},${yS(line(xMin)+SIGMA)} ${bx1},${yS(line(xMax)+SIGMA)} ${bx1},${yS(line(xMax)-SIGMA)} ${bx0},${yS(line(xMin)-SIGMA)}`,
    fill: 'var(--petrol)', opacity: '0.10'
  }));
  svg.appendChild(el('line', {x1:bx0, y1:yS(line(xMin)), x2:bx1, y2:yS(line(xMax)),
    stroke:'var(--petrol)', 'stroke-width':1.8, 'stroke-dasharray':'6 4', opacity:'0.9'}));
  svg.appendChild(el('text', {x: MARGIN.left + 8, y: MARGIN.top + 16, 'text-anchor':'start', class:'anno pet'},
    '大庆回归 · 高考 = 0.878×中考 + 114.7（r = 0.74）'));
  svg.appendChild(el('text', {x: bx0 + 6, y: yS(line(xMin)+SIGMA) - 5, class:'ax', fill:'var(--petrol)'}, '回归 +1σ'));
  svg.appendChild(el('text', {x: bx0 + 6, y: yS(line(xMin)-SIGMA) + 13, class:'ax', fill:'var(--petrol)'}, '回归 −1σ'));

  // ---- 三班回归（对这 47 个点做的最小二乘，红色虚线）----
  svg.appendChild(el('line', {x1:bx0, y1:yS(class3Line(xMin)), x2:bx1, y2:yS(class3Line(xMax)),
    stroke:'var(--seal)', 'stroke-width':1.8, 'stroke-dasharray':'6 4', opacity:'0.85'}));
  svg.appendChild(el('text', {x: MARGIN.left + PLOT_W - 8, y: MARGIN.top + PLOT_H - 10, 'text-anchor':'end', class:'anno', fill:'var(--seal)'},
    `三班回归 · 高考 ≈ ${CLASS3_SLOPE}×中考 + ${CLASS3_INT}（r=${CLASS3_R}）`));

  // ---- 林英魁／刘翔／刘欣到大庆回归预测值的虚线连线（与信度报告里同一张图一致的画法）----
  RAW.filter(d => HIGHLIGHT.includes(d.name)).forEach(d => {
    const cx = xS(d.zhongkao), cyActual = yS(d.actualMid), cyPred = yS(d.predict);
    svg.appendChild(el('line', {x1:cx, y1:cyActual, x2:cx, y2:cyPred,
      stroke:'var(--ink-3)', 'stroke-width':1.3, 'stroke-dasharray':'3 3'}));
    svg.appendChild(el('circle', {cx, cy:cyPred, r:5, fill:'none', stroke:'var(--petrol)', 'stroke-width':2}));
  });

  // ---- 中考 648 reference (林英魁 / 李梦然 same score) ----
  const x648 = xS(648);
  svg.appendChild(el('line', {x1:x648, y1:MARGIN.top, x2:x648, y2:MARGIN.top+PLOT_H,
    stroke:'var(--ink-3)', 'stroke-width':1, 'stroke-dasharray':'2 3', opacity:'0.5'}));
  svg.appendChild(el('text', {x:x648, y:MARGIN.top - 5, 'text-anchor':'middle', class:'ax'}, '中考 648'));

  // ---- 大庆 dots ----
  DAQING.forEach(d => {
    const cx = xS(d.s), cy = yS(d.g);
    const common = {cx, cy, class:'d-daqing'};
    let dot;
    if(d.soft){
      dot = el('circle', {...common, r:3.4, fill:'none', stroke:'var(--bar)', 'stroke-width':1.4});
    } else if(d.key){
      dot = el('circle', {...common, r:5, fill:'var(--bar)', stroke:'var(--card)', 'stroke-width':1.2});
    } else {
      dot = el('circle', {...common, r:3.4, fill:'var(--bar)', 'fill-opacity':'0.85'});
    }
    svg.appendChild(dot);
    bindTip(dot, () => tipHTML(
      MODE === 'name' ? `${d.n}（大庆${d.sc}）` : `大庆${d.sc}考生`,
      [['2004 中考', d.s + (d.soft ? '（配对存疑）' : '')], ['2007 高考', d.g], ['回归预测', Math.round(line(d.s))],
       ...(MODE === 'name' && d.uni ? [['录取', d.uni]] : [])],
      d.diff));
  });
  // 李梦然 callout
  const lm = DAQING.find(d => d.key);
  svg.appendChild(el('line', {x1:xS(lm.s), y1:yS(lm.g), x2:xS(lm.s)+12, y2:yS(lm.g)+16,
    stroke:'var(--amber)', 'stroke-width':0.8, opacity:'0.6'}));
  svg.appendChild(el('text', {x: xS(lm.s) + 14, y: yS(lm.g) + 20, class:'anno amb'},
    (MODE === 'name' ? '李梦然' : '大庆实验考生') + ' 中考 648 → 高考 709（全省第 3，清华应届）'));

  // ---- 三班 actual dots (全部 47 人都画，只有 HIGHLIGHT 里的三人另加文字标注) ----
  RAW.forEach(d => {
    const cx = xS(d.zhongkao);
    if(d.isRange){
      svg.appendChild(el('line', {x1:cx, y1:yS(d.actualHi), x2:cx, y2:yS(d.actualLo),
        stroke:'var(--seal)', 'stroke-width':2, opacity:'0.4'}));
    }
    const dot = el('circle', {cx, cy:yS(d.actualMid), r:3.8, class:'d-actual',
      stroke:'var(--card)', 'stroke-width':1.2});
    svg.appendChild(dot);
    const actualStr = d.isRange ? `${d.actualLo}–${d.actualHi}` : `${d.actualLo}`;
    bindTip(dot, () => tipHTML(
      MODE === 'name' ? `#${d.rank} ${d.name}` : `三班 · 第 ${d.rank} 名`,
      [['2004 中考', d.zhongkao], ['回归预测', d.predict], ['实测高考', actualStr],
       ...(MODE === 'name' && d.uni ? [['录取', d.uni]] : [])],
      d.diff));
  });

  // ---- 林英魁／刘翔／刘欣 callout（红色，画法与李梦然的 amber 标注一致）----
  const calloutOffsets = {'林英魁':[14,-8], '刘翔':[14,16], '刘欣':[14,16]};
  RAW.filter(d => HIGHLIGHT.includes(d.name)).forEach(d => {
    const cx = xS(d.zhongkao), cy = yS(d.actualMid);
    const [ox, oy] = calloutOffsets[d.name];
    const diff = Math.round(d.diff);
    svg.appendChild(el('line', {x1:cx, y1:cy, x2:cx + ox - 2, y2:cy + oy - 4,
      stroke:'var(--seal)', 'stroke-width':0.8, opacity:'0.6'}));
    svg.appendChild(el('text', {x: cx + ox, y: cy + oy, class:'anno', fill:'var(--seal)'},
      (MODE === 'name' ? d.name : `三班第 ${d.rank} 名`) + ` 中考 ${d.zhongkao} → 高考 ${d.actualLo}（残差 ${diff >= 0 ? '+' : '−'}${Math.abs(diff)}）`));
  });
}

// ===================== LEGEND / CAPTION / STATS =====================
function pill(html){ const d = document.createElement('div'); d.className = 'legend-item'; d.innerHTML = html; return d; }
const legend = document.getElementById('legend');
legend.append(
  pill('<span class="legend-line" style="border-color:var(--petrol)"></span>大庆回归线'),
  pill('<span class="legend-band"></span>±1σ（≈16 分）'),
  pill('<span class="legend-line" style="border-color:var(--seal)"></span>三班回归线（对这 47 人拟合）'),
  pill('<span class="legend-dot" style="background:var(--bar)"></span>大庆考生（55 人逐人配对）'),
  pill('<span class="legend-dot" style="background:var(--seal)"></span>三班实测高考（47 人）'),
);

const tDiffs = RAW.map(d => d.diff);
const tMean = tDiffs.reduce((a,b)=>a+b,0) / tDiffs.length;
const dDiffs = DAQING.map(d => d.diff);
const dMean = dDiffs.reduce((a,b)=>a+b,0) / dDiffs.length;
const dBelow = dDiffs.filter(x => x < 0).length;
const byName = n => RAW.find(d => d.name === n);

document.getElementById('figcap').innerHTML =
  `大庆 ${dDiffs.length} 名考生里 ${dBelow} 人低于回归线、${dDiffs.length - dBelow} 人高于，平均 ${dMean >= 0 ? '+' : ''}${dMean.toFixed(1)} 分——` +
  `散点落在带子两侧，这正是"回归线拟合得好"的样子。` +
  `<b>三班这 ${RAW.length} 人全部落在回归线以下</b>，平均低 ${Math.abs(tMean).toFixed(1)} 分。` +
  `标出姓名的三人——林英魁 −${Math.abs(Math.round(byName('林英魁').diff))}、刘翔 −${Math.abs(Math.round(byName('刘翔').diff))}、刘欣 −${Math.abs(Math.round(byName('刘欣').diff))}——` +
  `是全班里中考、高考均为实分、未经任何模型调整的三个点。` +
  `与林英魁同为中考 648 分的大庆考生李梦然，落在回归线上方，高考 709（全省第 3，清华应届）。`;

document.getElementById('stats-row').innerHTML = `
  <div class="sc"><b>${DAQING.length}</b><span>大庆参照考生（逐人配对）</span></div>
  <div class="sc ok"><b>${dMean >= 0 ? '+' : ''}${dMean.toFixed(1)}</b><span>大庆平均偏离回归线</span></div>
  <div class="sc hi"><b>${tMean.toFixed(1)}</b><span>三班平均偏离回归线</span></div>
  <div class="sc hi"><b>${Math.round(Math.min(...tDiffs))} ~ ${Math.round(Math.max(...tDiffs))}</b><span>三班缺口范围（分）</span></div>
`;

document.getElementById('note-text').innerHTML = `
  <span class="hd">读图说明</span>
  <b>回归线</b>用大庆「2007 年大庆一中市区应届高考与中考成绩对照」里 52 名<b>按中考入学筛选</b>的统招生拟合，
  因此没有范围限制偏差，斜率可信；它回答的是"<b>这个中考分数的人，高考平均考多少</b>"。数值与「666 分的信度报告」里
  「那么在大庆，648 分应该考多少」一图一致。<br/>
  <b>大庆灰点</b>是那份报告里同一批 55 组「2004 中考 → 2007 高考」逐人配对（大庆一中 52、大庆实验 2、大庆铁人 1）。<br/>
  <b>三班横坐标是逐人中考估计分</b>（据 <code>高三三班已知信息.csv</code>「中考成绩估算依据」列）——先按每个人的 2007 高考分数在全体已知高考的同学里的名次，
  映射到此前按班级模拟出的「名次→中考分」曲线上取一个基准值，再按初中生源地加组均值偏移（绥化市区 +0、绥棱／望奎／青冈／海伦 +15、北安 +5），
  叠加 N(0,6²) 的随机扰动，让中考与高考的关系带上大庆真实数据里那种<b>有噪声、不严格单调</b>的样子——有人中考更好但高考偏低，也有人反过来。
  这里只取高考 ≥ 600 分的 47 人（600 分以下的 11 人不画）。<br/>
  <b>红色文字标注</b>只标了三个人——<b>林英魁</b>中考 648 → 高考 666、<b>刘翔</b>中考 630 → 高考 657、<b>刘欣</b>中考 642 → 高考 630，
  三人中考是实分，未经模型调整；他们的中考分与回归预测值之间用虚线连接，蓝色空心圈是回归线上对应的预测值，三人全部落在预测值下方。
  大庆<b>李梦然</b>（amber 标注）中考同为 648，高考 709（全省第 3，清华应届），落在回归线上方。
  其余点都只是灰色或红色的普通圆点，不带文字，悬停能看到 tooltip。<br/>
  <b>红色虚线</b>是「三班回归」——单独对这 47 个点做的最小二乘（高考 ≈ 1.07×中考 − 43.5，r ≈ 0.77），只用来看三班内部中考、高考的相关程度，
  和大庆的 petrol 回归线不是一回事——两条线的截距差很大，不能直接比较预测值，只能比斜率和离散程度。<br/>
  点击顶部按钮可切换为<b>只显示名次</b>以保护隐私。
`;

// ===================== TOGGLE =====================
document.getElementById('seg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn || btn.dataset.mode === MODE) return;
  MODE = btn.dataset.mode;
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === MODE));
  buildChart();
});

buildChart();
</script>
</div>
</body>
</html>
